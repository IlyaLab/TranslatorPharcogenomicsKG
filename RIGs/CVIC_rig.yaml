# Reference Ingest Guide (RIG)
name: Clinical Interpretation of Variants in Cancer (CVIC) Reference Ingest Guide

#
# Information about the Source of the data ingest
source_info:
  infores_id: infores:CVIC
  name: Clinical Interpretation of Variants in Cancer (CVIC)
  description: "CIViC is a community-edited forum for discussion and interpretation of peer-reviewed publications pertaining to the clinical relevance of variants (or biomarker alterations) in cancer. These interpretations may include associations between molecular alterations (or lack of alteration) and one or more therapies, diagnoses, prognoses or other treatment decisions. These interpretations of clinical significance (or lack of clinical significance) are purely for research purposes. A finding of no interpretation does not necessarily indicate lack of relevance for any specific variant or biomarker alteration. Interpretations are not presented in ranked order of potential or predicted importance. These interpretations make no promise or guarantee of any clinical benefit (or lack of clinical benefit)."
  citations:
    - "Krysiak K, Danos AM, Saliba J, McMichael JF, Coffman AC, Kiwala S, et al. CIViCdb 2022: evolution of an open-access cancer variant interpretation knowledgebase. Nucleic Acids Res. 2023;51(D1):D1230–D1241. doi:10.1093/nar/gkac979"
  terms_of_use_info:
    license_name: "Creative Commons Public Domain Dedication (CC0 1.0 Universal)"
    license_url: "https://creativecommons.org/publicdomain/zero/1.0/"
  data_access_locations:
    - "Downloads: https://civicdb.org/releases/main (this page includes file sizes and simple data dictionaries for each download)"
  data_provision_mechanisms:
    - file_download
  data_formats:
    - tsv
  data_versioning_and_releases: "On average there are 1 release each month. Versioning is based on the month and year of the release. Releases page: https://civicdb.org/releases/main"
  source_status: maintained_regular_updates
  additional_notes:
    - ""

# Information about Ingested Content
ingest_info:
  ingest_categories:
    - primary_knowledge_provider
  utility: "CIViC is a community-edited forum for discussion and interpretation of peer-reviewed publications pertaining to the clinical relevance of variants (or biomarker alterations) in cancer."
  scope: "This initial ingest of CPIC covers interpretations which may include associations between molecular alterations (or lack of alteration) and one or more therapies, diagnoses, prognoses or other treatment decisions."

  relevant_files:
    - file_name: "01-Aug-2026-VariantSummaries.tsv"
      location: "https://civicdb.org/releases/main"
      description: "Primary entity records for Variants"
    - file_name: "01-Aug-2026-AcceptedClinicalEvidenceSummaries.tsv"
      location: "https://civicdb.org/releases/main"
      description: "Associations generated by Clinical Evidence in CIVIC db"

  included_content:
    - file_name: "01-Aug-2026-VariantSummaries.tsv"
      included_records: "Primary entity records for Variants"
      fields_used: "feature_type, feature_name, variant, single_variant_molecular_profile_id, representative_transcript, ensembl_version, clinvar_ids"
    - file_name: "01-Aug-2026-AcceptedClinicalEvidenceSummaries.tsv"
      included_records: "Associations generated by Clinical Evidence in CIVIC db"
      fields_used: "molecular_profile, molecular_profile_id, disease, doid, therapies, evidence_type, evidence_direction, evidence_level, significance,
       evidence_statement, citation_id, source_type, variant_origin"

  filtered_content:
    - file_name: "01-Aug-2026-AcceptedClinicalEvidenceSummaries.tsv"
      filtered_records: "Removed records with value in column molecular_profile is fusion gene"
      rationale: "since now biolink cannot handle fusion gene"
    - file_name: "01-Aug-2026-AcceptedClinicalEvidenceSummaries.tsv"
      filtered_records: "Removed records with column: evidence_direction as does not support"
      rationale: "to include relationship with high confidence"
    - file_name: "01-Aug-2026-AcceptedClinicalEvidenceSummaries.tsv"
      filtered_records: "Removed records with column: evidence_type as Functional"
      rationale: "no object node available"


  ## causing issues in local test
  future_considerations:
    - category: edge_content
      consideration: ""

