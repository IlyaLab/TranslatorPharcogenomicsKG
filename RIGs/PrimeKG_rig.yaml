# Reference Ingest Guide (RIG)
name: Precision Medicine Oriented Knowledge Graph (PrimeKG) Reference Ingest Guide

#
# Information about the Source of the data ingest
source_info:
  infores_id: infores:PrimeKG
  name: Precision Medicine Oriented Knowledge Graph (PrimeKG)
  description: "PrimeKG, a precision medicine-oriented knowledge graph that provides a holistic view of diseases. PrimeKG integrates 20 high-quality resources to describe 17,080 diseases with 4,050,249 relationships representing ten major biological scales, including disease-associated protein perturbations, biological processes and pathways, anatomical and phenotypic scale, and the entire range of approved and experimental drugs with their therapeutic action, considerably expanding previous efforts in disease-rooted knowledge graphs."
  citations:
    - "Chandak, Payal, 2022, "PrimeKG", https://doi.org/10.7910/DVN/IXA7BM, Harvard Dataverse, V2"
  terms_of_use_info:
    license_name: "Creative Commons Public Domain Dedication (CC0 1.0 Universal)"
    license_url: "https://creativecommons.org/publicdomain/zero/1.0/"
  data_access_locations:
    - "Downloads: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/IXA7BM (this page includes file sizes and simple data dictionaries for each download)"
  data_provision_mechanisms:
    - file_download
  data_formats:
    - csv
  data_versioning_and_releases: "No consistent cadence for releases. Versioning is based on the month and year of the release. Releases page / change log: https://zitniklab.hms.harvard.edu/projects/PrimeKG/"
  source_status: maintained_regular_updates
  additional_notes:
    - ""

# Information about Ingested Content
ingest_info:
  ingest_categories:
    - primary_knowledge_provider
  utility: "PrimeKG integrates 20 high-quality resources to describe 17,080 diseases with 4,050,249 relationships representing ten major biological scales"
  scope: "This initial ingest of PrimeKG covers disease-associated protein perturbations, biological processes and pathways, anatomical and phenotypic scale, and the entire range of approved and experimental drugs with their therapeutic action"

  relevant_files:
    - file_name: "nodes.csv"
      location: "https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/IXA7BM"
      description: "Node file"
    - file_name: "kg.csv"
      location: "https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/IXA7BM"
      description: "Associations covers disease-associated protein perturbations, biological processes and pathways, anatomical and phenotypic scale, and the entire range of approved and experimental drugs with their therapeutic action"

  included_content:
    - file_name: "kg.csv"
      included_records: "Include those 4 node types: 'gene/protein', 'drug', 'disease', 'effect/phenotype'"
      fields_used: ""

  filtered_content:
    - file_name: "kg.csv"
      filtered_records: "Removed records with column 'node_source' as 'MONDO_grouped'."
      rationale: "cannot handle those grouped MONDO codes"

  ## causing issues in local test
  future_considerations:
    - category: edge_content
      consideration: ""

