# Reference Ingest Guide (RIG)
name: Clinical Pharmacogenetics Implementation Consortium (CPIC) Reference Ingest Guide

#
# Information about the Source of the data ingest
source_info:
  infores_id: infores:CPIC
  name: Clinical Pharmacogenetics Implementation Consortium (CPIC)
  description: "The Clinical Pharmacogenetics Implementation Consortium (CPIC®) is an international consortium of individual volunteers and a small dedicated staff who are interested in facilitating use of pharmacogenetic tests for patient care."
  citations:
    - "M. Whirl-Carrillo, R. Huddart, L. Gong, K. Sangkuhl, C.F. Thorn, R. Whaley, T.E. Klein. "An evidence-based framework for evaluating pharmacogenomics knowledge for personalized medicine" Clinical Pharmacology & Therapeutics (2021) Sep;110(3):563-572."
  terms_of_use_info:
    license_name: "Creative Commons Attribution 4.0 International"
    license_url: "https://creativecommons.org/licenses/by/4.0/legalcode"
  data_access_locations:
    - "Downloads: https://www.clinpgx.org/cpic/pairs (this page includes file sizes and simple data dictionaries for each download)"
  data_provision_mechanisms:
    - file_download
  data_formats:
    - tsv
  data_versioning_and_releases: "No consistent cadence for releases, but on average there are 1-2 releases each month. Versioning is based on the month and year of the release. Releases page / change log: https://signor.uniroma2.it/downloads.php"
  source_status: maintained_regular_updates
  additional_notes:
    - ""

# Information about Ingested Content
ingest_info:
  ingest_categories:
    - primary_knowledge_provider
  utility: "The Clinical Pharmacogenetics Implementation Consortium (CPIC) is an international consortium of individual volunteers and a small dedicated staff who are interested in facilitating use of pharmacogenetic tests for patient care."
  scope: "This initial ingest of CPIC covers manually curated causal associations between genes and drugs"

  relevant_files:
    - file_name: "cpic-genes-drugs.tsv"
      location: "https://www.clinpgx.org/cpic/pairs"
      description: "Associations generated by knowledge assertions between Entity Types 'Gene', 'Drugs'"

  included_content:
    - file_name: "cpic-genes-drugs.tsv"
      included_records: "Associations generated by knowledge assertions with quality controlled edges between 'Gene', 'Drugs'"
      fields_used: "Drug,	Gene,	Guideline,	CPIC Level,	ClinPGx Level of Evidence,	PGx on FDA Label,	CPIC Publications (PMID)"

  filtered_content:
    - file_name: "cpic-genes-drugs.tsv"
      filtered_records: "Removed records with column 'PGx on FDA Label' as 'No Clinical PGx '."
      rationale: "to include relationship with high confidence"


  ## causing issues in local test
  future_considerations:
    - category: edge_content
      consideration: ""

## Information about the Graph Output by the ingest
## SIGNOR causual mechanism mapping (see mappings here: https://docs.google.com/spreadsheets/d/1DeAE04O1mz3R9s3dCZpG2hQp9hwif5WjdkUMsBci-u8/edit?gid=0#gid=0&range=D16))
target_info:
  edge_type_info:
    - subject_categories:
        - biolink:Gene
      predicates:
        - biolink:associated_with_response_to
      object_categories:
        - biolink:Drug
      qualifiers:
        - property: biolink:qualified_predicate
          value_enumeration:
              - None
        - property: biolink:object_aspect_qualifier
          value_enumeration:
              - None
        - property: biolink:object_direction_qualifier
          value_enumeration:
            - None
        - property: biolink:species_context_qualifier
          value_description: None
      knowledge_level:
        - knowledge_assertion
      agent_type:
        - text_mining_agent
      primary_knowledge_sources:
        - infores:CPIC
      ## MHB: edge properties need to include "biolink" prefix.; QW: fixed, thanks for pointing this out!
      edge_properties:
        - biolink:publications
        - biolink:attributes
        - biolink:supporting_text
      ui_explanation: "Signor records indicate the gene is associated with response to certain drug"

  node_type_info:
    - node_category: biolink:Gene
      source_identifier_types:
        - "NCBIGene"
    - node_category: biolink:Drug
      source_identifier_types:
        - "PUBCHEM.COMPOUND:"
  future_considerations:
    - category: node_properties  # conformance: was 'node_content'
      consideration: ""

